<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Single File App</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background-color: #1e293b;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      text-align: center;
      max-width: 400px;
      width: 90%;
      border: 1px solid #334155;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: #f8fafc;
    }

    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    button {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }

    button:hover {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      transform: translateY(-1px);
    }

    #output {
      margin-top: 1.5rem;
      padding: 12px;
      background-color: #090d16;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      word-break: break-all;
      text-align: left;
      min-height: 50px;
      border: 1px solid #1e293b;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Single File App</h1>
    <p>HTML, CSS & JS All-in-One File</p>
    <button onclick="fetchData()">Test API Endpoint</button>
    <div id="output">Click button to test response...</div>
  </div>

  <script>
    async function fetchData() {
      const outputDiv = document.getElementById('output');
      outputDiv.innerText = 'Fetching backend API...';

      try {
        // একই ডোমেইন বা Render সার্ভারের একই URL এ থাকা API হিট করবে
        const response = await fetch('/api/check');
        const data = await response.json();
        
        outputDiv.innerText = JSON.stringify(data, null, 2);
      } catch (error) {
        outputDiv.innerText = 'Error connecting to backend API!';
      }
    }
  </script>

</body>
</html>
